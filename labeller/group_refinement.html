<!doctype html><meta charset="utf-8"><title>Manual tree-group refinement</title>
<style>body{font:15px system-ui;margin:18px;background:#fafafa}canvas{width:560px;height:560px;cursor:crosshair}select,button{padding:8px;margin:4px}textarea{width:95%;height:60px}#pair{display:flex;gap:16px}.card{display:inline-block;margin:4px;padding:4px;border:1px solid #ddd}.card canvas{width:190px;height:190px}#status{color:#087}</style>
<p><a href="/gallery">View all 14 changed groups: original / proposed RGB and CHM</a></p><h2>Tree groups: manual RGB + CHM review — proposals, not frozen ground truth</h2>
<label>Site <select id="site"></select></label><label>Parent <select id="parent"></select></label><button id="prev">Previous site</button><button id="next">Next site</button>
<div id="pair"><div>RGB<canvas id="rgb" width="560" height="560"></canvas></div><div>CHM<canvas id="chm" width="560" height="560"></canvas></div></div>
<div id="info"></div><button id="add">Add drawn crown</button><button id="undo">Undo vertex</button><button id="clear">Clear crowns</button>
<label>Action <select id="action"><option value="retain">Retain group</option><option value="split">Extract individual crowns; retain unresolved remainder</option><option value="single">Reclassify whole group as one crown</option></select></label>
<textarea id="reason" placeholder="Specific evidence: visible crown separation/height saddle or reason to retain"></textarea>
<details><summary>Import manually specified crown vertices (400-pixel grid)</summary><textarea id="coordinates" placeholder="[[[x,y],[x,y],[x,y]], ...]"></textarea><button id="import">Import crown vertices</button></details>
<button id="save">Save review</button><button id="export">Export proposal</button><span id="status"></span><div id="cards"></div>
<button id="loadDraft">Load manually drawn draft for selected parent</button>
<script>
const manualDrafts = /*MANUAL_DRAFTS*/[{"id": "S007-mspep4dv", "site_id": "S007", "action": "split", "crowns": [[[274.51820128504187, 146.46680942177773], [278.80085653066635, 135.33190578222275], [285.22483940050006, 124.62526766583323], [292.93361884355545, 124.19700214266777], [301.49892933573574, 128.05139186233282], [307.49464668054134, 136.61670235544443], [304.92505353316665, 149.46466809511185], [294.64668094180524, 160.59957173466682], [288.65096359699965, 172.59100642427802], [283.2177016418427, 180.0], [247.35357098001987, 180.0], [248.82226980756968, 177.73019272089005], [253.96145610231906, 167.451820127666], [260.8137044971809, 158.02997858822346], [265.95289079193026, 151.60599571838975], [273.23340471088886, 148.17987152189016]]], "reason": "Upper narrow rounded crown has a distinct RGB perimeter and a neck to the lower connected canopy. Extract only the upper crown at the visible neck; the lower connected crowns remain unresolved tree_group.", "manual_cut_pixels": [[0, 180], [400, 180]]}, {"id": "S014-mss0nwrf", "site_id": "S014", "action": "split", "crowns": [[[190.1498929336667, 290.79229122027755], [183.2976445397362, 284.7965738773346], [182.0128479655832, 277.0877944342792], [179.8715203423053, 270.6638115644455], [185.010706637986, 263.81156316772103], [191.0064239827916, 256.5310492515564], [196.1456102784723, 249.67880085483193], [198.80728051345795, 245.80728051438928], [224.5807115798816, 271.58071158081293], [220.9850107068196, 278.3725910075009], [209.42184154130518, 286.0813704505563], [201.284796574153, 289.93576017022133], [189.7216274086386, 290.3640256971121]], [[198.80728051345795, 245.80728051438928], [200.8565310491249, 242.82655246183276], [206.8522483939305, 237.68736616522074], [214.1327623128891, 234.6895074956119], [223.55460385419428, 234.6895074956119], [230.40685224812478, 229.97858672216535], [234.68950749468058, 225.69593147933483], [242.39828693773597, 225.69593147933483], [250.53533190581948, 228.2655246257782], [257.8158458247781, 231.69164882227778], [261.24197002127767, 240.2569593153894], [259.95717344712466, 247.9657387584448], [254.81798715237528, 253.1049250550568], [247.9657387584448, 259.10064239799976], [241.54175588861108, 263.81156316772103], [228.69379014987499, 263.81156316772103], [224.5807115798816, 271.58071158081293]]], "reason": "RGB suggests two diagonally adjacent crown lobes with a narrow shared neck. CHM confirms a raised connected vegetation footprint but does not independently resolve a decisive height saddle. Propose a partition at the RGB neck with moderate confidence; Xi must review tree identity and the approximate shared boundary.", "manual_cut_pixels": [[100, 147], [350, 397]]}, {"id": "S017-mss1nobm", "site_id": "S017", "action": "split", "crowns": [[[218.0, 256.97583359107375], [220.9850107068196, 260.8137044981122], [222.6980728050694, 271.9486081376672], [227.40899357572198, 269.3790149874985], [232.54817987140268, 260.38543897122145], [239.40042826533318, 265.95289079099894], [248.82226980756968, 277.94432548061013], [257.8158458247781, 295.5032119899988], [252.24839400406927, 309.6359743028879], [235.1177730197087, 314.3468950763345], [235.1177730197087, 325.0535331889987], [225.6959314774722, 327.1948608122766], [222.2698072809726, 316.4882226996124], [218.8436830835417, 306.6381156332791], [218.0, 305.10414639115334]]], "reason": "The right-hand compact green RGB crown has its own perimeter and differs in texture from the left canopy. Extract the right crown at the narrow connection; retain the left connected canopy as unresolved tree_group.", "manual_cut_pixels": [[218, 0], [218, 400]]}];
let data,sid,groups,selected,images={},crowns=[],points=[];const $=id=>document.getElementById(id);
function line(c,p,color,width=1){if(!p.length)return;c.strokeStyle=color;c.lineWidth=width;c.beginPath();p.forEach(([x,y],i)=>i?c.lineTo(x*1.4,y*1.4):c.moveTo(x*1.4,y*1.4));c.closePath();c.stroke()}
function render(){for(let name of ['rgb','chm']){let c=$(name).getContext('2d');c.clearRect(0,0,560,560);c.drawImage(images[name],0,0,560,560);groups.forEach((l,i)=>{line(c,l.px,l.id===selected?.id?'#ff00ff':'#ffe000',l.id===selected?.id?2:1);let xs=l.px.map(p=>p[0]),ys=l.px.map(p=>p[1]);c.fillStyle='#fff';c.font='12px monospace';c.fillText(i+1,Math.min(...xs)*1.4,Math.min(...ys)*1.4)});crowns.forEach(p=>line(c,p,'#00ffff',3));line(c,points,'#00ff00',3)}$('info').textContent=`${sid} ${data.sites[sid].split} ${data.sites[sid].stratum}; parent ${selected?.id}, area ${selected?.area_m2?.toFixed(1)} m²; drawn ${crowns.length}; action ${$('action').value}`}
function parent(){selected=groups[$('parent').selectedIndex];let d=data.decisions[selected?.id];crowns=d?.crowns||[];points=[];$('action').value=d?.action||'retain';$('save').disabled=!selected;$('loadDraft').disabled=!selected;$('reason').value=d?.reason||'';render()}
async function site(){sid=$('site').value;groups=data.labels.sites[sid].labels.filter(l=>l.cls==='tree_group');$('parent').innerHTML=groups.map((l,i)=>`<option>${i+1}: ${l.id} (${l.area_m2.toFixed(1)} m²)</option>`).join('');for(let name of ['rgb','chm']){images[name]=new Image();images[name].src=`/chips/${sid}/${name}.png`;await images[name].decode()}parent();$('cards').innerHTML='';groups.forEach((l,i)=>{let div=document.createElement('div');div.className='card';div.innerHTML=`<div>${i+1}: ${l.id}</div>`;for(let name of ['rgb','chm']){let cv=document.createElement('canvas');cv.width=cv.height=190;let c=cv.getContext('2d');let xs=l.px.map(p=>p[0]),ys=l.px.map(p=>p[1]),x=Math.max(0,Math.min(...xs)-8),y=Math.max(0,Math.min(...ys)-8),w=Math.min(400-x,Math.max(...xs)-x+8),h=Math.min(400-y,Math.max(...ys)-y+8),scale=Math.min(190/w,190/h);c.drawImage(images[name],x,y,w,h,0,0,w*scale,h*scale);c.strokeStyle='#ff0';c.beginPath();l.px.forEach(([a,b],j)=>j?c.lineTo((a-x)*scale,(b-y)*scale):c.moveTo((a-x)*scale,(b-y)*scale));c.closePath();c.stroke();div.append(cv)}div.onclick=()=>{$('parent').selectedIndex=i;parent()};$('cards').append(div)})}
for(let name of ['rgb','chm'])$(name).onclick=e=>{let r=e.target.getBoundingClientRect();points.push([(e.clientX-r.left)*400/r.width,(e.clientY-r.top)*400/r.height]);render()};
$('add').onclick=()=>{if(points.length>=3){crowns.push(points);points=[];$('action').value='split';render()}};$('undo').onclick=()=>{points.pop();render()};$('clear').onclick=()=>{crowns=[];points=[];render()};$('parent').onchange=parent;$('site').onchange=site;
$('import').onclick=()=>{crowns=JSON.parse($('coordinates').value);points=[];$('action').value='split';render()};
$('loadDraft').onclick=()=>{let d=manualDrafts.find(d=>d.id===selected?.id);if(!d){$('status').textContent='No manually prepared draft for this parent';return}crowns=d.crowns;points=[];$('reason').value=d.reason;$('action').value='split';render()};
for(let [id,delta] of [['prev',-1],['next',1]])$(id).onclick=()=>{$('site').selectedIndex=Math.max(0,Math.min(23,$('site').selectedIndex+delta));site()};
async function post(url,d){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let t=await r.text();$('status').textContent=t;if(!r.ok)throw Error(t);return JSON.parse(t)}
$('save').onclick=async()=>{let d={id:selected.id,action:$('action').value,reason:$('reason').value,crowns:crowns};await post('/api/save',d);data.decisions[selected.id]=d};$('export').onclick=()=>post('/api/export',{});
fetch('/api/data').then(r=>r.json()).then(d=>{data=d;$('site').innerHTML=Object.keys(d.sites).sort().map(s=>`<option>${s}</option>`).join('');site()});
</script>
